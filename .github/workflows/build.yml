name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libgmpxx4ldbl \
            sqlite3 \
            libsqlite3-dev \
            zlib1g-dev \
            openssl \
            libssl-dev \
            python3-pip \
            python3-setuptools \
            libgdbm-dev \
            libc6-dev \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            tk-dev \
            libtinfo6 \
            libffi8 \
            zip \
            unzip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython setuptools

      - name: Build APK with Buildozer
        run: |
          ACCEPT_BUILD_LICENSES=y buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
